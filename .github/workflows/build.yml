name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Tag builds publish to the GitHub release the packaged app's updater polls;
# that needs the token to write contents. Nothing else does.
permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

env:
  # `always` on a tag, `never` otherwise: a push to main keeps its artifacts.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
  # Unsigned on macOS: there is no Developer ID here. Gatekeeper will
  # quarantine the download; `xattr -cr "/Applications/Code Monet.app"`
  # clears it. Signing and notarization are a certificate away — see
  # electron-builder.yml.
  CSC_IDENTITY_AUTO_DISCOVERY: false

# One job per (OS, architecture): the app carries native modules — the
# terminal's pty, the speech recognizer, the SQLite store — and a bundled
# ripgrep, all picked for the machine that runs the build. An x64 app
# cross-built on an arm64 runner ships arm64 binaries inside it, which is
# exactly what happened when the config listed both architectures and every
# Mac runner built both: the two then raced to upload the same files and
# one of them lost. The architecture is the CLI flag's alone now, and the
# Intel build waits for the Apple-silicon one so the two do not write the
# shared latest-mac.yml at the same moment.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # postinstall rebuilds better-sqlite3 for Electron's ABI; the other
      # native modules ship prebuilt for every platform.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --win --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: code-monet-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: code-monet-mac-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-mac-arm64
          path: desktop/release/latest-mac.yml
          if-no-files-found: error

  mac-x64:
    needs: mac-arm64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --x64 --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: code-monet-mac-x64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-mac-x64
          path: desktop/release/latest-mac.yml
          if-no-files-found: error

  # Each Mac job wrote a latest-mac.yml naming only its own zip, and the
  # updater reads ONE. Merge the two and put the merged one on the release
  # — see desktop/scripts/merge-mac-manifest.mjs.
  mac-manifest:
    needs: [mac-arm64, mac-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: manifest-mac-arm64
          path: manifests/arm64
      - uses: actions/download-artifact@v4
        with:
          name: manifest-mac-x64
          path: manifests/x64
      - run: node scripts/merge-mac-manifest.mjs ../latest-mac.yml ../manifests/arm64/latest-mac.yml ../manifests/x64/latest-mac.yml
      - run: cat latest-mac.yml
        working-directory: .
      - run: gh release upload "${GITHUB_REF_NAME}" latest-mac.yml --clobber
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
