appId: com.codemonet.desktop
productName: Code Monet
directories:
  output: release
files:
  - out/**/*
  # The tray reads this at runtime, so it has to be INSIDE the app — the
  # `icon:` entries below only tell the builder what to stamp on the installer
  # and the .exe. Without this line the tray icon works in dev and is blank in
  # every shipped build.
  - build/icon.png
# The voice cloner is a Python program the app COPIES OUT to the data dir, so
# it must arrive as real files rather than inside app.asar.
extraResources:
  - from: resources/voice-cloner
    to: voice-cloner
  # Same reason: the bridge extension is COPIED OUT to a folder the user hands
  # to Chrome's "Load unpacked", which cannot read inside app.asar.
  - from: resources/browser-extension
    to: browser-extension
# Native binaries can't be spawned from inside app.asar — keep them on disk
# (spawn paths swap app.asar → app.asar.unpacked at runtime).
asarUnpack:
  - out/main/vendor/ripgrep/**
  # The speech recognizer is a native addon with its own onnxruntime DLLs;
  # neither can be loaded from inside app.asar.
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**
  - node_modules/sherpa-onnx-win-ia32/**
  - node_modules/sherpa-onnx-darwin-x64/**
  - node_modules/sherpa-onnx-darwin-arm64/**
  - node_modules/sherpa-onnx-linux-x64/**
  - node_modules/sherpa-onnx-linux-arm64/**
  # The Supertonic voice runs on Microsoft's onnxruntime, same constraint.
  - node_modules/onnxruntime-node/**
  # The terminal's pty is a native addon too — pty.node and winpty's DLLs
  # cannot be loaded from inside app.asar.
  - node_modules/@homebridge/node-pty-prebuilt-multiarch/**
win:
  target: nsis
  icon: build/icon.ico
  forceCodeSigning: false
  # signAndEditExecutable defaults to true — rcedit embeds build/icon.ico into the .exe
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
