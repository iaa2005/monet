appId: com.claude-code.desktop
productName: Claude Code Desktop
directories:
  output: release
files:
  - out/**/*
# Native binaries can't be spawned from inside app.asar — keep them on disk
# (spawn paths swap app.asar → app.asar.unpacked at runtime).
asarUnpack:
  - out/main/vendor/ripgrep/**
win:
  target: nsis
  icon: build/icon.ico
  forceCodeSigning: false
  signAndEditExecutable: false
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
