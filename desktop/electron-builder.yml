appId: com.codemonet.desktop
productName: Code Monet
directories:
  output: release
# GitHub Releases are both the DISTRIBUTION channel and the UPDATE feed:
# `npm run release` uploads the installer + latest.yml here, and the packaged
# app's electron-updater polls the same place. Publishing needs GH_TOKEN in
# the environment; the app itself needs none (the repo's releases are public).
publish:
  provider: github
  owner: iaa2005
  repo: monet
  # Publish for real, not as a draft: a draft release is invisible to the
  # updater, so the default made every `npm run release` a two-step dance
  # (upload here, then un-draft on GitHub by hand).
  releaseType: release
files:
  - out/**/*
  # The tray reads this at runtime, so it has to be INSIDE the app — the
  # `icon:` entries below only tell the builder what to stamp on the installer
  # and the .exe. Without this line the tray icon works in dev and is blank in
  # every shipped build.
  - build/icon.png
# The voice cloner is a Python program the app COPIES OUT to the data dir, so
# it must arrive as real files rather than inside app.asar.
extraResources:
  - from: resources/voice-cloner
    to: voice-cloner
  # Same reason: the bridge extension is COPIED OUT to a folder the user hands
  # to Chrome's "Load unpacked", which cannot read inside app.asar.
  - from: resources/browser-extension
    to: browser-extension
  # macOS Computer Use: Swift source compiled on the user's machine at first
  # use (see src/main/computer/mac.ts) — swiftc reads it from disk.
  - from: resources/mac-computer
    to: mac-computer
# Native binaries can't be spawned from inside app.asar — keep them on disk
# (spawn paths swap app.asar → app.asar.unpacked at runtime).
asarUnpack:
  - out/main/vendor/ripgrep/**
  # The speech recognizer is a native addon with its own onnxruntime DLLs;
  # neither can be loaded from inside app.asar.
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**
  - node_modules/sherpa-onnx-win-ia32/**
  - node_modules/sherpa-onnx-darwin-x64/**
  - node_modules/sherpa-onnx-darwin-arm64/**
  - node_modules/sherpa-onnx-linux-x64/**
  - node_modules/sherpa-onnx-linux-arm64/**
  # The Supertonic voice runs on Microsoft's onnxruntime, same constraint.
  - node_modules/onnxruntime-node/**
  # The terminal's pty is a native addon too — conpty.node and the ConPTY
  # DLL/exe it spawns cannot be loaded or launched from inside app.asar.
  # @lydell/node-pty resolves the platform package at runtime, so BOTH the
  # wrapper and the binary package have to be out.
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-*/**
win:
  target: nsis
  icon: build/icon.ico
  forceCodeSigning: false
  # signAndEditExecutable defaults to true — rcedit embeds build/icon.ico into the .exe
mac:
  # zip is NOT optional: electron-updater on macOS updates FROM the zip; a
  # dmg-only publish leaves the packaged app silently unable to update.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Hardened runtime is what notarization requires; the entitlements poke the
  # holes Electron + our native addons (onnxruntime, sherpa-onnx, node-pty,
  # better-sqlite3) need to run under it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Dictation and the voice cloner record from the microphone. Audio is
      processed on this Mac.
    # Computer Use reads the screen and the accessibility tree. macOS asks for
    # these once, and an app with no usage string is refused without a prompt.
    NSAppleEventsUsageDescription: >-
      Computer Use controls other applications on your behalf — opening
      documents, typing and clicking — only while you have it switched on.
    # Screen Recording has no dedicated key; the capture APIs prompt on first
    # use. This one covers the accessibility tree the text-only path reads.
    NSAccessibilityUsageDescription: >-
      Computer Use reads on-screen controls and moves the pointer and keyboard,
      only while you have it switched on.
  # Signing/notarization: works unsigned for local use (Gatekeeper will
  # quarantine downloads). For distribution set CSC_LINK/CSC_KEY_PASSWORD
  # (Developer ID cert) and notarize:
  #   notarize: { teamId: <TEAM_ID> }  + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD
dmg:
  writeUpdateInfo: false
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
