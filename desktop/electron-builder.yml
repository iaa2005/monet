appId: com.codemonet.desktop
productName: Code Monet
directories:
  output: release
files:
  - out/**/*
  # The tray reads this at runtime, so it has to be INSIDE the app — the
  # `icon:` entries below only tell the builder what to stamp on the installer
  # and the .exe. Without this line the tray icon works in dev and is blank in
  # every shipped build.
  - build/icon.png
# Native binaries can't be spawned from inside app.asar — keep them on disk
# (spawn paths swap app.asar → app.asar.unpacked at runtime).
asarUnpack:
  - out/main/vendor/ripgrep/**
win:
  target: nsis
  icon: build/icon.ico
  forceCodeSigning: false
  # signAndEditExecutable defaults to true — rcedit embeds build/icon.ico into the .exe
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
