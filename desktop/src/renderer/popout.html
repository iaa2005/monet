<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Monet</title>
    <!--
      The host page for a popped-out dock group. Deliberately empty: dockview
      opens this window from the renderer and ADOPTS the group's live DOM into
      it — same origin, same process, no scripts of its own. Styles travel
      with the adopted nodes; the background just avoids a white flash.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f6f1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1d1e1f;
        }
      }
    </style>
  </head>
  <body></body>
</html>
