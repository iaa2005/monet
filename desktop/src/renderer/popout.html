<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Monet</title>
    <!--
      The host page for a popped-out dock group. Deliberately empty: dockview
      opens this window from the renderer and ADOPTS the group's live DOM into
      it — same origin, same process, no scripts of its own. Styles travel
      with the adopted nodes; the background just avoids a white flash.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* --bg-100 in globals.css. Hardcoded because this page loads before
           any stylesheet is copied in; dressPopout swaps it for the real
           token the moment the window is dressed. These were two hexes from
           a palette the app stopped using, so the flash was cream. */
        background: #f9f9f9;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #181818;
        }
      }
    </style>
  </head>
  <body></body>
</html>
